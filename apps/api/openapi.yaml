      type: object
      properties:
        messages:
          minItems: 1
          maxItems: 20
          type: array
          items:
            type: object
            properties:
              role:
                type: string
                enum:
                  - user
                  - assistant
              content:
                type: string
                minLength: 1
                maxLength: 4000
            required:
