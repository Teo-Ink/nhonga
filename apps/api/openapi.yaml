          maxLength: 80
        advertiserContact:
          type: string
          maxLength: 120
        imageUrl:
          type: string
          minLength: 1
          maxLength: 2000
        clickUrl:
          type: string
          maxLength: 2000
          format: uri
        headline:
          type: string
          maxLength: 120
        placement:
          type: string
          minLength: 1
          maxLength: 32
        categorySlug:
          type: string
          minLength: 1
          maxLength: 160
        days:
          type: integer
          minimum: 1
          maximum: 90
        paymentMethod:
          type: string
          minLength: 1
          maxLength: 32
      required:
