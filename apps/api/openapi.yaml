components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token de sessão (7 dias).
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Uma por acção de pagamento; a repetição devolve a primeira resposta.
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{8,128}$
  responses:
    Problem:
      description: Erro (problem+json)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details. 5xx answers carry requestId for support.
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: Stable machine code, e.g. invalid_body, rate_limited
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
        requestId:
          type: string
    OtpRequest:
      type: object
      properties:
        phone:
          type: string
          minLength: 1
          maxLength: 32
      required:
        - phone
    OtpVerify:
      type: object
      properties:
        challengeId:
          type: string
          minLength: 1
          maxLength: 64
        code:
          type: string
          pattern: ^\d{6}$
        referralCode:
          type: string
          maxLength: 32
      required:
        - challengeId
        - code
    ListingInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 140
        category:
          type: string
          minLength: 1
          maxLength: 64
        description:
          type: string
          maxLength: 4000
        priceCents:
          type: integer
          minimum: 0
          maximum: 100000000000
        stock:
          type: integer
          minimum: 0
          maximum: 100000
        photos:
          maxItems: 6
          type: array
          items:
            anyOf:
              - type: string
                maxLength: 12000000
                pattern: ^data:image\/(jpeg|png|webp);base64,
              - type: string
                maxLength: 2000
                pattern: ^(\/api\/media\/|https:\/\/)
        shopName:
          type: string
          maxLength: 80
      required:
        - title
        - category
        - priceCents
    ListingStatus:
      type: object
      properties:
        status:
          type: string
          enum:
            - active
            - sold
            - archived
      required:
        - status
    ListingEvent:
      type: object
      properties:
        type:
          type: string
          enum:
            - view
            - contact
            - share
      required:
        - type
    ListingReport:
      type: object
      properties:
        reason:
          type: string
          enum:
            - fraud
            - prohibited
            - spam
            - wrong_category
            - offensive
            - other
        note:
          type: string
          maxLength: 1000
      required:
        - reason
    ContactReveal:
      type: object
      properties:
        productSlug:
          type: string
          minLength: 1
          maxLength: 160
        vendorSlug:
          type: string
          minLength: 1
          maxLength: 160
    ComplaintCreate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        contact:
          type: string
          minLength: 1
          maxLength: 160
        subject:
          type: string
          enum:
            - payment
            - listing
            - account
            - privacy
            - advertising
            - other
        body:
          type: string
          minLength: 10
          maxLength: 4000
      required:
        - name
        - contact
        - subject
        - body
    ComplaintResolve:
      type: object
      properties:
        status:
          type: string
          enum:
            - answered
            - closed
        resolution:
          type: string
          minLength: 1
          maxLength: 4000
      required:
        - status
        - resolution
    ConversationStart:
      type: object
      properties:
        vendorSlug:
          type: string
          minLength: 1
          maxLength: 160
        productSlug:
          type: string
          minLength: 1
          maxLength: 160
        body:
          type: string
          minLength: 1
          maxLength: 2000
      required:
        - vendorSlug
        - body
    MessageSend:
      type: object
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 2000
      required:
        - body
    FavoriteAdd:
      type: object
      properties:
        productId:
          type: string
          minLength: 1
          maxLength: 64
      required:
        - productId
    ReviewCreate:
      type: object
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          maxLength: 1000
        productSlug:
          type: string
          minLength: 1
          maxLength: 160
      required:
        - rating
    SavedSearchCreate:
      type: object
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 120
        href:
          type: string
          minLength: 1
          maxLength: 500
          format: starts_with
          pattern: ^\/.*
        query:
          type: object
          propertyNames:
            type: string
          additionalProperties: {}
      required:
