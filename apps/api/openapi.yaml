      type: object
      properties:
        text:
          type: string
          maxLength: 500
        image:
          type: string
          maxLength: 12000000
        mediaType:
          type: string
          maxLength: 32
    ProductListOut:
      type: object
      properties:
        total:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        items:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              slug:
                type: string
              title:
                type: string
              priceCents:
                type: integer
                minimum: -9007199254740991
                maximum: 9007199254740991
                description: centavos (MZN)
              compareAtCents:
                type: integer
                minimum: -9007199254740991
                maximum: 9007199254740991
                description: centavos (MZN)
              discountPercent:
                type:
                  - number
                  - "null"
              image:
                type: object
                properties:
                  url:
                    type: string
                  width:
                    type: number
                  height:
                    type: number
                  lqip:
                    type: string
                  alt:
                    type: string
                required:
                  - url
                  - width
                  - height
                additionalProperties: false
              ratingAvg:
                type:
                  - number
                  - "null"
              ratingCount:
                type: integer
                minimum: -9007199254740991
                maximum: 9007199254740991
              inStock:
                type: boolean
              freeDelivery:
                type: boolean
              location:
                type:
                  - string
