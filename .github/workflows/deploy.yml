name: Deploy API

# Application deploys (a new image), separate from infrastructure changes
# (terraform.yml). Staging deploys automatically once CI passes on main;
# production is manual and gated on the production environment's reviewer.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        type: choice
        options: [staging, production]

concurrency:
  group: deploy-api-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: af-south-1
  ECR_REPOSITORY: nhonga-api

jobs:
  # Only deploy on a green CI run, or an explicit dispatch. A failed CI run must
  # never trigger a deploy.
  guard:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - run: echo "CI green or manual dispatch — proceeding"

  build-and-push:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Image tag from commit
        id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      # Build/push uses the staging deploy role; ECR is shared across envs.
      - name: Assume deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-build-${{ github.run_id }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY:$TAG"
          # The repository is IMMUTABLE, so a re-run for an existing tag is a
          # no-op push rather than a silent overwrite.
          docker build -f apps/api/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "Pushed $IMAGE"

  deploy-staging:
    needs: build-and-push
    if: github.event_name == 'workflow_run' || github.event.inputs.environment == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-deploy-staging-${{ github.run_id }}
      - name: Deploy to ECS (staging)
        uses: ./.github/actions/ecs-deploy
        with:
          cluster: nhonga-staging
          service: api
          image_tag: ${{ needs.build-and-push.outputs.image_tag }}
          region: ${{ env.AWS_REGION }}

  deploy-production:
    needs: build-and-push
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Reviewer on the production environment gates this and mints the OIDC token.
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-deploy-prod-${{ github.run_id }}
      - name: Deploy to ECS (production)
        uses: ./.github/actions/ecs-deploy
        with:
          cluster: nhonga-production
          service: api
          image_tag: ${{ needs.build-and-push.outputs.image_tag }}
          region: ${{ env.AWS_REGION }}
