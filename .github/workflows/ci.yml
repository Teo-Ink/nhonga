name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to the same branch makes the previous run irrelevant. Cancel it
# rather than paying for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  # ── Gate 1: does it meet the house style and compile at all? ──────────────
  quality:
    name: Format, lint, typecheck, boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version is read from the "packageManager" field in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Architectural boundaries
        # Fails if packages/shared ever imports from an app. See
        # .dependency-cruiser.cjs for why that specific rule matters.
        run: pnpm boundaries

  # ── Gate 2: does it behave? ───────────────────────────────────────────────
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        # packages/shared publishes from dist and the API consumes its emitted
        # declarations, so the build must precede the API tests.
        run: pnpm build

      - name: Test
        run: pnpm test

  # ── Gate 3: does the published contract still match the code? ─────────────
  api-contract:
    name: OpenAPI lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint OpenAPI spec
        run: pnpm api:lint

  # ── Gate 4: secrets and vulnerable dependencies ───────────────────────────
  security:
    name: Secret scan and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs history to scan commits, not just the tree.
          fetch-depth: 0

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Dependency audit
        # Blocks on high and critical only. Moderate findings are reported but
        # do not stop a release; a payments platform that cannot ship a fix
        # because of a moderate advisory in a build tool is less safe, not more.
        run: pnpm audit --audit-level high

  # ── Gate 5: static analysis ───────────────────────────────────────────────
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v3

  # ── Gate 6: infrastructure as code ────────────────────────────────────────
  iac:
    name: Terraform fmt, validate and scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform fmt
        run: terraform fmt -check -recursive infra/terraform

      - name: Terraform validate (bootstrap)
        working-directory: infra/terraform/bootstrap
        run: |
          terraform init -backend=false
          terraform validate

      - name: IaC security scan
        # tfsec is now part of Trivy; this replaces the standalone action.
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: infra/terraform
          format: sarif
          output: trivy-iac.sarif
          exit-code: "1"
          severity: HIGH,CRITICAL

      - name: Upload scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-iac.sarif
          category: trivy-iac
