# P1-07: weekly dependency updates, grouped so the PR list stays readable.
# Security updates arrive as soon as an advisory is published, regardless of
# the schedule. Major versions are left to a person (they need reading).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Africa/Maputo }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /apps/mobile
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Africa/Maputo }
    open-pull-requests-limit: 3
    groups:
      expo:
        patterns: ["expo*", "@expo/*", "react-native*"]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: docker
    directory: /apps/api
    schedule: { interval: weekly }

  - package-ecosystem: docker
    directory: /apps/web
    schedule: { interval: weekly }

  - package-ecosystem: terraform
    directory: /infra/terraform/envs/staging
    schedule: { interval: monthly }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
